{% extends "base.html" %}
{% block title %}Delete Student{% endblock title %}
{% block content %}
<header>
    <h1>Delete Student</h1>
    <p>Enter the ID of the student to remove. This also delete their photo and cannot be undone</p>
</header>

<form method="POST" onsubmit="return confirm('Delete this student? This cannot be undone.');">
    {% csrf_token %}
    <div>
        <label for="sid">Student ID</label>
        <input type="text" id="sid" name="sid" required autofocus>
    </div>
    <button type="submit">Delete Student</button>
</form>
{% if message %}
<div>{{ message }}</div>
{% endif %}
{% endblock content %}
