{% extends "base.html" %}
{% block title %} addStudent {% endblock title %}
{% block content %}
<header>
    <h1>Add Student</h1>
    <p>Enter the student details. The student ID must be unique</p>
</header>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {% include "_form_fields.html" %}
    <div>
        <button type="submit">Add student</button>
        <a href="{% url 'view_All_Student' %}" >Cancel</a>
    </div>
</form>

{% endblock content %}
