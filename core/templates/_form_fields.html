{% if form.non_field_errors %}
    <div role="alert">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
    <div class="field{% if field.errors %} has-error {% endif %}">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}
            <p>{{ field.help_text }}</p>
        {% endif %}
        {% for error in field.errors %}
            <p> {{ error }} </p>
        {% endfor %}
    </div>
{% endfor %}
